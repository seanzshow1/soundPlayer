<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlayHTML Remote MP3 Player</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171717;
      background: #f3f3f3;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .player {
      width: min(620px, 100%);
      padding: 24px;
      background: #fff;
      border: 1px solid #d5d5d5;
      border-radius: 16px;
      box-shadow: 0 10px 32px rgba(0,0,0,.08);
    }
    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    .mode {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      background: #ececec;
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .status {
      margin: 6px 0 0;
      color: #555;
      line-height: 1.45;
    }
    .drop-zone {
      display: grid;
      min-height: 145px;
      place-items: center;
      padding: 22px;
      margin-bottom: 14px;
      text-align: center;
      border: 2px dashed #9c9c9c;
      border-radius: 12px;
      background: #fafafa;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .drop-zone:hover,
    .drop-zone.is-dragging {
      border-color: #222;
      background: #f0f0f0;
    }
    .drop-zone strong { display: block; margin-bottom: 6px; }
    .drop-zone small { color: #666; }
    .file-name {
      display: block;
      margin-top: 10px;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }
    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .host-tools {
      margin-bottom: 20px;
    }
    .host-tools p {
      margin: 8px 0 0;
      color: #666;
      font-size: .88rem;
      line-height: 1.4;
    }
    .track {
      margin: 0 0 18px;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
      overflow-wrap: anywhere;
    }
    .track strong { display: block; margin-bottom: 3px; font-size: .82rem; color: #666; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button, .mode-link {
      font: inherit;
    }
    button {
      padding: 10px 16px;
      border: 1px solid #aaa;
      border-radius: 9px;
      background: #fff;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #f0f0f0; }
    button:disabled { opacity: .42; cursor: not-allowed; }
    .primary {
      border-color: #222;
      background: #222;
      color: #fff;
    }
    .primary:hover:not(:disabled) { background: #444; }
    .volume {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) 3.5rem;
      gap: 10px;
      align-items: center;
      margin-top: 18px;
    }
    .volume output { text-align: right; font-variant-numeric: tabular-nums; }
    .mode-links {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e4e4e4;
    }
    .mode-link {
      color: inherit;
      font-size: .88rem;
    }
    .note {
      margin: 16px 0 0;
      color: #666;
      font-size: .86rem;
      line-height: 1.45;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="shared-audio-player" class="player" can-play>
    <div class="topline">
      <div>
        <h1>Remote MP3 Player</h1>
        <p class="status" data-status role="status">Connecting…</p>
      </div>
      <span class="mode" data-mode-label></span>
    </div>

    <section data-player-only hidden>
      <label class="drop-zone" data-drop-zone>
        <input class="file-input" data-file-input type="file" accept="audio/mpeg,.mp3" />
        <span>
          <strong>Drop the MP3 here</strong>
          <small>or click to choose it</small>
          <span class="file-name" data-file-name>No MP3 loaded</span>
        </span>
      </label>

      <div class="host-tools">
        <button class="primary" type="button" data-enable-audio disabled>Enable remote playback</button>
        <p>Load the MP3, then press this once on the Player device. Leave this page open.</p>
      </div>
    </section>

    <div class="track">
      <strong>Loaded track</strong>
      <span data-track-name>None</span>
    </div>

    <div class="controls" aria-label="Audio controls">
      <button class="primary" type="button" data-action="play" disabled>Play</button>
      <button type="button" data-action="pause" disabled>Pause</button>
      <button type="button" data-action="stop" disabled>Stop</button>
    </div>

    <label class="volume">
      <span>Volume</span>
      <input data-volume type="range" min="0" max="1" step="0.01" value="0.8" disabled />
      <output data-volume-output>80%</output>
    </label>

    <p class="note" data-remote-note hidden>
      This page sends commands only. The MP3 stays on the Player device and the sound comes from that device.
    </p>

    <nav class="mode-links" aria-label="Player mode">
      <a class="mode-link" href="?mode=player">Open as Player</a>
      <a class="mode-link" href="?mode=remote">Open as Remote</a>
    </nav>
  </main>

  <script type="module">
    import { playhtml } from "https://unpkg.com/playhtml";

    // Both ?mode=player and ?mode=remote must join the same room.
    const ROOM = "remote-mp3-player-v1";
    const params = new URLSearchParams(window.location.search);
    const isRemote = params.get("mode") === "remote";

    const root = document.getElementById("shared-audio-player");
    const statusEl = root.querySelector("[data-status]");
    const modeLabel = root.querySelector("[data-mode-label]");
    const playerOnly = root.querySelector("[data-player-only]");
    const remoteNote = root.querySelector("[data-remote-note]");
    const dropZone = root.querySelector("[data-drop-zone]");
    const fileInput = root.querySelector("[data-file-input]");
    const fileNameEl = root.querySelector("[data-file-name]");
    const enableAudioButton = root.querySelector("[data-enable-audio]");
    const trackNameEl = root.querySelector("[data-track-name]");
    const volumeEl = root.querySelector("[data-volume]");
    const volumeOutput = root.querySelector("[data-volume-output]");
    const playButton = root.querySelector('[data-action="play"]');
    const pauseButton = root.querySelector('[data-action="pause"]');
    const stopButton = root.querySelector('[data-action="stop"]');

    modeLabel.textContent = isRemote ? "Remote" : "Player";
    playerOnly.hidden = isRemote;
    remoteNote.hidden = !isRemote;

    let audioContext = null;
    let audioBuffer = null;
    let gainNode = null;
    let currentSource = null;
    let currentSourceRevision = -1;
    let currentSourceNaturalEnd = false;
    let localTrackName = "";
    let hostArmed = false;
    let latestSharedData = null;
    let latestSetData = null;
    let hostOnline = false;

    root.defaultData = {
      state: "stopped",
      position: 0,
      startedAt: 0,
      volume: 0.8,
      trackName: "",
      revision: 0
    };

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function expectedPosition(data) {
      if (data.state !== "playing" || !data.startedAt) {
        return Number(data.position || 0);
      }
      return Math.max(0, Number(data.position || 0) + (Date.now() - data.startedAt) / 1000);
    }

    function stopLocalSource() {
      if (!currentSource) return;
      currentSourceNaturalEnd = false;
      try { currentSource.stop(); } catch (_) {}
      try { currentSource.disconnect(); } catch (_) {}
      currentSource = null;
    }

    function applyHostTransport(data, setData) {
      if (isRemote || !hostArmed || !audioBuffer || !audioContext || !gainNode) return;

      gainNode.gain.value = clamp(Number(data.volume ?? 0.8), 0, 1);

      if (Number(data.revision) === currentSourceRevision) return;
      currentSourceRevision = Number(data.revision);
      stopLocalSource();

      if (data.state !== "playing") return;

      const offset = expectedPosition(data);
      if (offset >= audioBuffer.duration) {
        setData((draft) => {
          draft.state = "stopped";
          draft.position = 0;
          draft.startedAt = 0;
          draft.revision += 1;
        });
        return;
      }

      const source = audioContext.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(gainNode);
      currentSource = source;
      currentSourceNaturalEnd = true;

      source.addEventListener("ended", () => {
        const endedNaturally = currentSource === source && currentSourceNaturalEnd;
        if (currentSource === source) currentSource = null;
        if (!endedNaturally) return;

        const current = latestSharedData;
        if (current?.state === "playing" && Number(current.revision) === currentSourceRevision) {
          setData((draft) => {
            draft.state = "stopped";
            draft.position = 0;
            draft.startedAt = 0;
            draft.revision += 1;
          });
        }
      });

      source.start(0, offset);
    }

    function setSharedControlsEnabled(enabled) {
      playButton.disabled = !enabled;
      pauseButton.disabled = !enabled;
      stopButton.disabled = !enabled;
      volumeEl.disabled = !enabled;
    }

    function renderHostPresence() {
      const presences = playhtml.presence.getPresences();
      hostOnline = false;

      for (const [, presence] of presences) {
        if (presence.audioHost?.ready) {
          hostOnline = true;
          break;
        }
      }

      if (isRemote) {
        setSharedControlsEnabled(hostOnline);
        if (!hostOnline) {
          statusEl.textContent = "Waiting for the Player device to load and enable its MP3.";
        } else if (latestSharedData) {
          statusEl.textContent = latestSharedData.state === "playing"
            ? "Player is playing."
            : latestSharedData.state === "paused"
              ? "Player is paused."
              : "Player is ready.";
        }
      }
    }

    async function loadLocalFile(file, setData) {
      if (isRemote || !file) return;

      const looksLikeMp3 = file.type === "audio/mpeg" || file.name.toLowerCase().endsWith(".mp3");
      if (!looksLikeMp3) {
        statusEl.textContent = "Choose an MP3 file.";
        return;
      }

      stopLocalSource();
      hostArmed = false;
      enableAudioButton.disabled = true;
      setSharedControlsEnabled(false);
      playhtml.presence.setMyPresence("audioHost", { ready: false, trackName: file.name });

      statusEl.textContent = "Loading MP3…";
      fileNameEl.textContent = file.name;

      try {
        if (!audioContext) {
          audioContext = new AudioContext();
          gainNode = audioContext.createGain();
          gainNode.connect(audioContext.destination);
        }

        const bytes = await file.arrayBuffer();
        audioBuffer = await audioContext.decodeAudioData(bytes.slice(0));
        localTrackName = file.name;

        setData((draft) => {
          draft.trackName = file.name;
          draft.state = "stopped";
          draft.position = 0;
          draft.startedAt = 0;
          draft.revision += 1;
        });

        enableAudioButton.disabled = false;
        statusEl.textContent = "MP3 loaded. Press “Enable remote playback” once.";
      } catch (error) {
        console.error(error);
        audioBuffer = null;
        localTrackName = "";
        fileNameEl.textContent = "No MP3 loaded";
        statusEl.textContent = "This MP3 could not be decoded by the browser.";
      }
    }

    async function enableRemotePlayback() {
      if (isRemote || !audioContext || !audioBuffer) return;

      try {
        await audioContext.resume();
        hostArmed = audioContext.state === "running";

        if (!hostArmed) {
          statusEl.textContent = "Audio is still blocked. Press Enable remote playback again.";
          return;
        }

        enableAudioButton.textContent = "Remote playback enabled";
        enableAudioButton.disabled = true;
        setSharedControlsEnabled(true);
        playhtml.presence.setMyPresence("audioHost", { ready: true, trackName: localTrackName });
        statusEl.textContent = "Player ready. You can now control it from the Remote page.";

        if (latestSharedData && latestSetData) {
          applyHostTransport(latestSharedData, latestSetData);
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent = "The browser did not enable audio.";
      }
    }

    root.updateElement = ({ data, setData }) => {
      latestSharedData = data;
      latestSetData = setData;

      trackNameEl.textContent = data.trackName || "None";
      const volume = clamp(Number(data.volume ?? 0.8), 0, 1);
      volumeEl.value = String(volume);
      volumeOutput.value = `${Math.round(volume * 100)}%`;

      applyHostTransport(data, setData);

      if (isRemote) {
        renderHostPresence();
      } else if (hostArmed) {
        statusEl.textContent = data.state === "playing"
          ? "Playing from this device."
          : data.state === "paused"
            ? "Paused. Remote control remains connected."
            : "Player ready. Remote control remains connected.";
      }
    };

    root.onMount = ({ getData, setData }) => {
      latestSetData = setData;

      const sendPlay = () => {
        const data = getData();
        const position = data.state === "stopped" ? 0 : expectedPosition(data);
        setData((draft) => {
          draft.state = "playing";
          draft.position = position;
          draft.startedAt = Date.now();
          draft.revision += 1;
        });
      };

      const sendPause = () => {
        const data = getData();
        const position = expectedPosition(data);
        setData((draft) => {
          draft.state = "paused";
          draft.position = position;
          draft.startedAt = 0;
          draft.revision += 1;
        });
      };

      const sendStop = () => {
        setData((draft) => {
          draft.state = "stopped";
          draft.position = 0;
          draft.startedAt = 0;
          draft.revision += 1;
        });
      };

      const sendVolume = () => {
        const value = clamp(Number(volumeEl.value), 0, 1);
        setData((draft) => {
          draft.volume = value;
        });
      };

      playButton.addEventListener("click", sendPlay);
      pauseButton.addEventListener("click", sendPause);
      stopButton.addEventListener("click", sendStop);
      volumeEl.addEventListener("input", sendVolume);

      if (!isRemote) {
        const onFileChange = () => loadLocalFile(fileInput.files?.[0], setData);
        const onDragOver = (event) => {
          event.preventDefault();
          dropZone.classList.add("is-dragging");
        };
        const onDragLeave = () => dropZone.classList.remove("is-dragging");
        const onDrop = (event) => {
          event.preventDefault();
          dropZone.classList.remove("is-dragging");
          loadLocalFile(event.dataTransfer?.files?.[0], setData);
        };

        fileInput.addEventListener("change", onFileChange);
        dropZone.addEventListener("dragover", onDragOver);
        dropZone.addEventListener("dragleave", onDragLeave);
        dropZone.addEventListener("drop", onDrop);
        enableAudioButton.addEventListener("click", enableRemotePlayback);

        return () => {
          playButton.removeEventListener("click", sendPlay);
          pauseButton.removeEventListener("click", sendPause);
          stopButton.removeEventListener("click", sendStop);
          volumeEl.removeEventListener("input", sendVolume);
          fileInput.removeEventListener("change", onFileChange);
          dropZone.removeEventListener("dragover", onDragOver);
          dropZone.removeEventListener("dragleave", onDragLeave);
          dropZone.removeEventListener("drop", onDrop);
          enableAudioButton.removeEventListener("click", enableRemotePlayback);
          playhtml.presence.setMyPresence("audioHost", null);
        };
      }

      return () => {
        playButton.removeEventListener("click", sendPlay);
        pauseButton.removeEventListener("click", sendPause);
        stopButton.removeEventListener("click", sendStop);
        volumeEl.removeEventListener("input", sendVolume);
      };
    };

    await playhtml.init({ room: ROOM });

    if (isRemote) {
      playhtml.presence.setMyPresence("audioHost", null);
      const unsubscribe = playhtml.presence.onPresenceChange("audioHost", renderHostPresence);
      renderHostPresence();
      window.addEventListener("beforeunload", unsubscribe, { once: true });
    } else {
      playhtml.presence.setMyPresence("audioHost", { ready: false, trackName: "" });
      statusEl.textContent = "Drop an MP3 to begin.";
    }
  </script>
</body>
</html>
